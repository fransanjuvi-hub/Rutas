<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#151a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Senderos">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<title>Senderos Todoterreno — Prototipo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --bg:#151a14;
    --panel:#1e251c;
    --ink:#eef0e6;
    --muted:#9aa593;
    --verde:#4C8A22;
    --amarillo:#FFD400;
    --rojo:#E53935;
    --naranja:#B85C00;
    --azul:#378ADD;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);}
  #map{position:absolute;inset:0;}

  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:1000;
    display:flex;justify-content:flex-end;align-items:flex-start;
    padding:14px 14px 0 14px;pointer-events:none;
  }

  .topbar-left{
    position:absolute;top:14px;left:14px;z-index:1000;
    display:flex;align-items:flex-start;gap:8px;
  }

  .speed-badge{
    background:var(--panel);color:var(--ink);
    border-radius:10px;padding:8px 16px;text-align:center;min-width:64px;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
    pointer-events:auto;
  }
  .speed-badge .val{font-size:20px;font-weight:600;line-height:1;}
  .speed-badge .unit{font-size:10px;color:var(--muted);margin-top:2px;}


  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;}

  .menu-btn{
    position:absolute;right:14px;bottom:20px;z-index:1000;
    width:48px;height:48px;border-radius:50%;
    background:var(--panel);border:none;color:var(--ink);
    box-shadow:0 2px 10px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
  }
  .menu-btn.active{ background:var(--azul); }

  .menu-panel{
    position:absolute;right:14px;bottom:82px;z-index:1000;
    background:var(--panel);border-radius:12px;overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.35);display:none;flex-direction:column;
    min-width:190px;
  }
  .menu-panel.show{ display:flex; }
  .menu-panel button{
    background:none;border:none;color:var(--ink);text-align:left;
    padding:13px 16px;font-size:14px;
  }
  .menu-panel button:not(:last-child){ border-bottom:1px solid rgba(255,255,255,.08); }
  .menu-panel button.quitar{ color:#E53935; }

  .leaflet-control-zoom{
    display:flex !important;flex-direction:row !important;
    position:absolute !important;right:68px !important;bottom:20px !important;
    margin:0 !important;
  }
  .leaflet-control-zoom a{ width:34px !important;height:34px !important;line-height:34px !important;font-size:15px !important; }
  .leaflet-control-zoom-in{ border-radius:8px 0 0 8px !important; }
  .leaflet-control-zoom-out{ border-radius:0 8px 8px 0 !important; }

  .leaflet-control-layers{ border-radius:8px !important; }
  .leaflet-control-layers-toggle{ width:34px !important;height:34px !important; }
  .leaflet-control-scale-line{
    background:var(--panel) !important;color:var(--ink) !important;
    border:none !important;padding:6px 10px !important;border-radius:8px !important;
    font-size:11px !important;
  }


  .info-toggle{
    flex-shrink:0;
    width:38px;height:38px;border-radius:10px;
    background:var(--panel);border:none;color:var(--ink);
    box-shadow:0 2px 10px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;transition:transform .2s;
    pointer-events:auto;
  }
  .info-toggle.abierto{ transform:rotate(180deg); }

  .info-panel{
    display:none;gap:8px;
  }
  .info-panel.show{ display:flex; }
  .info-box{
    background:var(--panel);border-radius:10px;padding:8px 14px;text-align:center;min-width:64px;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
    pointer-events:auto;
  }
  .info-box .val{ font-size:18px;font-weight:600;line-height:1; }
  .info-box .unit{ font-size:10px;color:var(--muted);margin-top:2px; }

  .aviso-osm{
    position:absolute;left:14px;top:64px;z-index:1500;
    background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:10px;
    font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.35);
    opacity:0;transition:opacity .3s;pointer-events:none;
  }
  .aviso-osm.show{ opacity:1; }

  .draw-toolbar{
    position:absolute;left:14px;right:14px;top:70px;z-index:1000;
    background:var(--panel);border-radius:12px;padding:10px 14px;
    display:none;align-items:center;justify-content:space-between;
    box-shadow:0 2px 10px rgba(0,0,0,.35);font-size:13px;
  }
  .draw-toolbar.show{ display:flex; }
  .draw-toolbar button{
    border:none;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;
  }
  .btn-cancel{ background:transparent;color:var(--muted); }
  .btn-finish{ background:var(--azul);color:white; }

  .sheet-overlay{
    position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.5);
    display:none;align-items:flex-end;
  }
  .sheet-overlay.show{ display:flex; }
  .sheet{
    background:var(--panel);width:100%;border-radius:16px 16px 0 0;
    padding:18px 18px 24px;
  }
  .sheet h3{ margin:0 0 4px; font-size:16px; }
  .sheet .field-label{ font-size:12px;color:var(--muted);margin:14px 0 8px; }
  .sheet input[type=text]{
    width:100%;background:#131811;border:1px solid var(--muted);border-radius:8px;
    color:var(--ink);padding:9px 10px;font-size:14px;
  }
  .swatches{ display:flex;gap:10px; }
  .swatch{
    width:44px;height:44px;border-radius:50%;border:3px solid transparent;
    display:flex;align-items:center;justify-content:center;
  }
  .swatch.selected{ border-color:white; }
  .sheet-actions{ display:flex;gap:10px;margin-top:20px; }
  .sheet-actions button{
    flex:1;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;
  }
  .btn-guardar{ background:var(--azul);color:white; }
  .btn-cancelar-sheet{ background:transparent;color:var(--muted);border:1px solid var(--muted) !important; }
  .leaflet-popup-tip{background:var(--panel);}
  .leaflet-popup-content{font-size:12.5px;margin:10px 12px;}
  .leaflet-popup-content b{display:block;margin-bottom:3px;}

  .popup-acciones .leaflet-popup-content-wrapper{ padding:4px; border-radius:14px; }
  .popup-acciones .leaflet-popup-content{ margin:2px; }
  .popup-acciones .leaflet-popup-tip{ display:none; }
  .fila-iconos{ display:flex; gap:8px; }
  .icono-accion{
    width:42px;height:42px;border-radius:50%;border:none;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;color:white;
  }
  .icono-borrar{ background:#E53935; }
  .icono-navegar{ background:#378ADD; }
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar-left">
  <button class="info-toggle" id="infoToggle" title="Rumbo y trip">›</button>
  <div class="info-panel" id="infoPanel">
    <div class="info-box" id="tripBox" title="Toca para reiniciar"><div class="val" id="tripVal">0.0</div><div class="unit">trip km</div></div>
    <div class="info-box"><div class="val" id="rumboVal">--</div><div class="unit">grados</div></div>
  </div>
</div>

<div class="topbar">
  <div class="speed-badge"><div class="val" id="speedVal">--</div><div class="unit">km/h</div></div>
</div>

<button class="menu-btn" id="menuBtn" title="Menú">☰</button>
<div class="menu-panel" id="menuPanel"></div>
<input type="file" id="gpxInput" accept=".gpx" style="display:none">

<div class="aviso-osm" id="avisoOsm"></div>

<div class="draw-toolbar" id="drawToolbar">
  <span id="drawHint">Toca el mapa para marcar el camino</span>
  <div style="display:flex;gap:8px;">
    <button class="btn-cancel" id="btnDeshacerPunto" title="Deshacer último punto">↶</button>
    <button class="btn-cancel" id="btnCancelDraw">Cancelar</button>
    <button class="btn-finish" id="btnFinishDraw">Listo</button>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">
    <h3>Nuevo camino</h3>
    <input type="text" id="nombrePista" placeholder="Nombre del camino (opcional)">

    <div class="field-label">Dificultad</div>
    <div class="swatches" id="swatchesDificultad">
      <div class="swatch" data-val="verde" style="background:#4C8A22">✓</div>
      <div class="swatch" data-val="amarillo" style="background:#FFD400"></div>
      <div class="swatch" data-val="rojo" style="background:#E53935"></div>
    </div>

    <div class="field-label">Legalidad</div>
    <div class="swatches" id="swatchesLegal">
      <div class="swatch" data-val="verde" style="background:#4C8A22">✓</div>
      <div class="swatch" data-val="amarillo" style="background:#D98A00"></div>
      <div class="swatch" data-val="rojo" style="background:#A11E1E"></div>
    </div>

    <div class="sheet-actions">
      <button class="btn-cancelar-sheet" id="btnCancelarSheet">Descartar</button>
      <button class="btn-guardar" id="btnGuardarPista">Guardar</button>
    </div>
  </div>
</div>



<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---- Centro inicial: Biar (Alicante) ----
const START = [38.6330, -0.7667];

const map = L.map('map', { zoomControl:false, preferCanvas:true }).setView(START, 14);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(err => console.warn('No se pudo activar el modo offline', err));
}

// Varios estilos de mapa
const MAPTILER_KEY = 'XgC5ZGwB6l2URF1gr8I1';
const capaMinimal = L.tileLayer(`https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}@2x.png?key=${MAPTILER_KEY}`, {
  maxZoom: 20, attribution: '&copy; MapTiler &copy; OpenStreetMap contributors'
});
const capaTopo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  maxZoom: 17, attribution: '&copy; OpenStreetMap contributors, SRTM | estilo: OpenTopoMap'
});
const capaSatelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, attribution: 'Esri World Imagery'
});

capaMinimal.addTo(map); // estilo por defecto: limpio y minimalista
let capaActiva = capaMinimal;
map.on('baselayerchange', (e)=>{ capaActiva = e.layer; });

const controlCapas = L.control.layers({
  'Minimalista': capaMinimal,
  'Topográfico': capaTopo,
  'Satélite': capaSatelite
}, null, { position:'bottomleft', collapsed:true }).addTo(map);

L.control.zoom({ position:'bottomright' }).addTo(map);

const COLORS = { verde:'#4C8A22', amarillo:'#FFD400', rojo:'#E53935' };
const COLORS_CONTORNO = { verde:'#4C8A22', amarillo:'#D98A00', rojo:'#A11E1E' };

// ---- Sistema de grosor/visibilidad adaptado al zoom ----
// A ~2km de escala (zoom bajo) no se ven los caminos; van engrosando según te acercas
const todosLosCaminos = []; // { group, casing, gap, interior, zonaToque }

function pesosPorZoom(z){
  if(z <= 12) return null; // oculto (escala ~2km o más alejado)
  if(z === 13) return { casing:2.6, gap:1.4, interior:0.8, toque:14 }; // ~1.5km, fino
  if(z === 14) return { casing:3.6, gap:2, interior:1.1, toque:17 };
  if(z === 15) return { casing:4.8, gap:2.7, interior:1.4, toque:20 };
  return { casing:6, gap:3.4, interior:1.8, toque:22 }; // zoom 16+
}

function crearCaminoVisual(coords, colorContorno, colorInterior, popupHtml, atenuado, opciones){
  opciones = opciones || {};
  const casing = L.polyline(coords, { color:colorContorno, weight:1, lineCap:'round', opacity: atenuado?0.5:1 });
  const gap = L.polyline(coords, { color:'#E7E2CC', weight:1, lineCap:'round', opacity:0.9 });
  const interior = L.polyline(coords, { color:colorInterior, weight:1, lineCap:'round', opacity: atenuado?0.6:1 });
  const zonaToque = L.polyline(coords, { color:'#000', weight:14, opacity:0 });
  const group = L.layerGroup([casing, gap, interior, zonaToque]);
  const entry = { group, casing, gap, interior, zonaToque, idUsuario: opciones.idUsuario || null };

  if(popupHtml){
    zonaToque.on('click', (e)=>{
      if(dibujando){ agregarPuntoDibujo(e.latlng); return; }
      zonaToque.bindPopup(popupHtml).openPopup(e.latlng);
    });
    zonaToque.on('contextmenu', (e)=>{
      L.DomEvent.preventDefault(e);
      if(dibujando) return; // en modo dibujo, la pulsación larga sobre un camino no hace nada
      zonaToque.closePopup();
      mostrarMenuAcciones(e.latlng, entry);
    });
  }

  todosLosCaminos.push(entry);
  aplicarEstiloAUnCamino(entry, map.getZoom());
  return entry;
}

function borrarCamino(entry){
  map.closePopup();
  map.removeLayer(entry.group);
  const idx = todosLosCaminos.indexOf(entry);
  if(idx > -1) todosLosCaminos.splice(idx, 1);
  eliminarPistaUsuarioPorId(entry.idUsuario);
}

async function navegarHastaPunto(latlng){
  map.closePopup();
  if(!userMarker){
    mostrarAvisoOsm('Aún no se ha detectado tu posición GPS', true);
    return;
  }
  mostrarAvisoOsm('Calculando ruta hasta el punto…');
  const origen = userMarker.getLatLng();
  const ruta = await obtenerRutaSiguiendoCaminos([[origen.lat, origen.lng], [latlng.lat, latlng.lng]]);
  if(ruta && ruta.length > 1){
    dibujarGpx(ruta, 'Ruta hasta el punto');
    mostrarAvisoOsm('Ruta calculada ✓', true);
  } else {
    mostrarAvisoOsm('No se pudo calcular la ruta hasta ahí', true);
  }
}

function mostrarMenuAcciones(latlng, entry){
  const esPropio = !!(entry && entry.idUsuario);
  const uid = Date.now();
  const idBorrar = 'accB' + uid;
  const idNavegar = 'accN' + uid;
  const html = `<div class="fila-iconos">
    ${esPropio ? `<button id="${idBorrar}" class="icono-accion icono-borrar">🗑</button>` : ''}
    <button id="${idNavegar}" class="icono-accion icono-navegar">➤</button>
  </div>`;
  L.popup({ closeButton:false, className:'popup-acciones', offset:[0,-4] })
    .setLatLng(latlng).setContent(html).openOn(map);

  setTimeout(()=>{
    if(esPropio){
      const btnB = document.getElementById(idBorrar);
      if(btnB) btnB.addEventListener('click', ()=> borrarCamino(entry));
    }
    const btnN = document.getElementById(idNavegar);
    if(btnN) btnN.addEventListener('click', ()=> navegarHastaPunto(latlng));
  }, 0);
}

function aplicarEstiloAUnCamino(entry, zoom){
  const pesos = pesosPorZoom(zoom);
  if(!pesos){
    if(map.hasLayer(entry.group)) map.removeLayer(entry.group);
    return;
  }
  if(!map.hasLayer(entry.group)) entry.group.addTo(map);
  entry.casing.setStyle({ weight: pesos.casing });
  entry.gap.setStyle({ weight: pesos.gap });
  entry.interior.setStyle({ weight: pesos.interior });
  entry.zonaToque.setStyle({ weight: pesos.toque });
}

function actualizarEstiloTodosLosCaminos(){
  const zoom = map.getZoom();
  todosLosCaminos.forEach(entry => aplicarEstiloAUnCamino(entry, zoom));
}
map.on('zoomend', actualizarEstiloTodosLosCaminos);

function renderPista(p){
  const popup = `<b>${p.nombre || 'Camino sin nombre'}</b>${p.info || ''}${p.idUsuario ? '<br><small>Mantén pulsado el camino para borrarlo</small>' : ''}`;
  crearCaminoVisual(p.coords, COLORS_CONTORNO[p.legal], COLORS[p.dificultad], popup, false, { idUsuario: p.idUsuario || null });
}

// ---- Carga automática de caminos reales (OpenStreetMap) con estimación de color ----
function mostrarAvisoOsm(texto, autoOcultar){
  const el = document.getElementById('avisoOsm');
  el.textContent = texto;
  el.classList.add('show');
  if(autoOcultar){
    clearTimeout(mostrarAvisoOsm._t);
    mostrarAvisoOsm._t = setTimeout(()=> el.classList.remove('show'), 3500);
  }
}

const COLOR_GRIS = '#8a8a8a';
const idsOsmRenderizados = new Set();
let timeoutCargaOsm = null;

function estimarPista(tags){
  let dificultad = null;
  let legal = null;
  const motivos = [];

  const tracktype = tags.tracktype;
  const surface = tags.surface;
  const smoothness = tags.smoothness;
  const width = parseFloat(tags.width);
  const access = tags.access;
  const motorVehicle = tags.motor_vehicle || tags.motorcar;
  const soloTodoterreno = tags['4wd_only'] === 'yes';
  const tieneVado = tags.ford === 'yes';

  const TEXTO_TRACKTYPE = {
    grade1:'pista sólida y bien afirmada', grade2:'pista bastante sólida',
    grade3:'pista mixta (tierra y piedra)', grade4:'pista poco firme',
    grade5:'pista muy blanda o poco definida'
  };
  const TEXTO_SMOOTHNESS = {
    excellent:'superficie excelente', good:'superficie en buen estado',
    intermediate:'superficie irregular', bad:'superficie en mal estado',
    very_bad:'superficie muy deteriorada', horrible:'superficie muy difícil',
    very_horrible:'superficie extrema', impassable:'intransitable'
  };
  const TEXTO_SURFACE = {
    compacted:'firme compactado', gravel:'grava', fine_gravel:'gravilla fina',
    ground:'tierra', dirt:'tierra suelta', unpaved:'sin asfaltar',
    rock:'roca', mud:'barro', sand:'arena', stone:'piedra'
  };

  // Un camino asfaltado no es offroad: nunca se colorea, se deja sin determinar
  const esAsfaltado = ['asphalt','paved','concrete','paving_stones'].includes(surface);
  if(esAsfaltado){
    return { dificultad:'gris', legal:'gris', motivos:['Firme asfaltado: no se clasifica como pista offroad'] };
  }

  if(smoothness && TEXTO_SMOOTHNESS[smoothness]){
    if(['excellent','good'].includes(smoothness)){ dificultad='verde'; motivos.push(TEXTO_SMOOTHNESS[smoothness]); }
    else if(smoothness === 'intermediate'){ dificultad='amarillo'; motivos.push(TEXTO_SMOOTHNESS[smoothness]); }
    else if(['bad','very_bad','horrible','very_horrible','impassable'].includes(smoothness)){ dificultad='rojo'; motivos.push(TEXTO_SMOOTHNESS[smoothness]); }
  }
  if(dificultad === null && tracktype && TEXTO_TRACKTYPE[tracktype]){
    if(tracktype === 'grade1' || tracktype === 'grade2'){ dificultad = 'verde'; motivos.push(TEXTO_TRACKTYPE[tracktype]); }
    else if(tracktype === 'grade3'){ dificultad = 'amarillo'; motivos.push(TEXTO_TRACKTYPE[tracktype]); }
    else if(tracktype === 'grade4' || tracktype === 'grade5'){ dificultad = 'rojo'; motivos.push(TEXTO_TRACKTYPE[tracktype]); }
  }
  if(dificultad === null && surface && TEXTO_SURFACE[surface]){
    if(surface === 'compacted'){ dificultad='verde'; motivos.push(TEXTO_SURFACE[surface]); }
    else if(['gravel','fine_gravel','ground','dirt','unpaved'].includes(surface)){ dificultad='amarillo'; motivos.push(TEXTO_SURFACE[surface]); }
    else if(['rock','mud','sand','stone'].includes(surface)){ dificultad='rojo'; motivos.push(TEXTO_SURFACE[surface]); }
  }
  if(soloTodoterreno){ dificultad = 'rojo'; motivos.push('solo apto para todoterreno'); }
  if(tieneVado){ dificultad = 'rojo'; motivos.push('tiene vado o cruce de agua'); }

  if(!isNaN(width)){ legal = width >= 4 ? 'verde' : 'rojo'; motivos.push('ancho: ' + width + ' m'); }
  if(access === 'no' || access === 'private' || motorVehicle === 'no' || motorVehicle === 'private'){
    legal = 'rojo'; motivos.push('acceso restringido');
  }
  if(legal === null && dificultad !== null) legal = 'amarillo'; // hay datos de dificultad pero no de anchura: revisar

  return { dificultad: dificultad || 'gris', legal: legal || 'gris', motivos };
}

function renderCaminoOsm(coords, dificultad, legal, tags, motivos){
  const colorInt = dificultad === 'gris' ? COLOR_GRIS : COLORS[dificultad];
  const colorCont = legal === 'gris' ? COLOR_GRIS : COLORS_CONTORNO[legal];
  const detalle = (motivos && motivos.length) ? motivos.join(' · ') : 'Sin datos suficientes';
  const etiqueta = dificultad==='gris' ? 'Sin clasificar todavía' : `Estimación automática (${detalle}) · revisar sobre el terreno`;
  const popup = `<b>${tags.name || 'Camino sin nombre'}</b>${etiqueta}`;
  crearCaminoVisual(coords, colorCont, colorInt, popup, dificultad==='gris');
}

// ---- Caché local de caminos, para que funcionen también sin conexión ----
const OSM_CACHE_KEY = 'senderos_cache_osm_v1';

function leerCacheOsm(){
  try{ return JSON.parse(localStorage.getItem(OSM_CACHE_KEY)) || []; }
  catch(e){ return []; }
}

function guardarEnCacheOsm(nuevosElementos){
  if(!nuevosElementos || !nuevosElementos.length) return;
  const actuales = leerCacheOsm();
  const idsExistentes = new Set(actuales.map(w=>w.id));
  nuevosElementos.forEach(w=>{
    if(!idsExistentes.has(w.id) && w.geometry && w.geometry.length>1){
      actuales.push({ id:w.id, geometry:w.geometry, tags:w.tags||{} });
      idsExistentes.add(w.id);
    }
  });
  const recortado = actuales.slice(-8000); // límite de seguridad para el móvil
  try{ localStorage.setItem(OSM_CACHE_KEY, JSON.stringify(recortado)); }
  catch(e){ console.warn('La caché de caminos está llena', e); }
}

function wayDentroDeBbox(way, b){
  return way.geometry.some(pt => pt.lat>=b.getSouth() && pt.lat<=b.getNorth() && pt.lon>=b.getWest() && pt.lon<=b.getEast());
}

function renderizarDesdeCacheOsm(b){
  let añadidos = 0;
  leerCacheOsm().forEach(way=>{
    if(idsOsmRenderizados.has(way.id) || !wayDentroDeBbox(way, b)) return;
    idsOsmRenderizados.add(way.id);
    const coords = way.geometry.map(pt => [pt.lat, pt.lon]);
    const { dificultad, legal, motivos } = estimarPista(way.tags || {});
    renderCaminoOsm(coords, dificultad, legal, way.tags || {}, motivos);
    añadidos++;
  });
  return añadidos;
}

let ultimoBboxConsultado = null;

function bboxCubierto(actual, anterior){
  if(!anterior) return false;
  return actual.getSouth() >= anterior.getSouth() && actual.getNorth() <= anterior.getNorth()
      && actual.getWest()  >= anterior.getWest()  && actual.getEast() <= anterior.getEast();
}

async function cargarCaminosOsmEnVista(){
  if(map.getZoom() < 13){
    mostrarAvisoOsm('Acércate más (zoom) para ver los caminos de la zona');
    return;
  }
  const b = map.getBounds();
  const desdeCache = renderizarDesdeCacheOsm(b);
  if(desdeCache > 0) mostrarAvisoOsm(`${desdeCache} caminos cargados (guardados)`, true);

  if(bboxCubierto(b, ultimoBboxConsultado)) return; // ya consultamos esta zona hace poco

  if(!navigator.onLine){
    if(desdeCache === 0) mostrarAvisoOsm('Sin conexión: no hay caminos guardados de esta zona', true);
    return;
  }

  const bAmpliado = b.pad(0.3); // margen extra para cubrir movimientos cercanos sin repetir consulta
  const bbox = `${bAmpliado.getSouth()},${bAmpliado.getWest()},${bAmpliado.getNorth()},${bAmpliado.getEast()}`;
  const query = `[out:json][timeout:25];(way["highway"~"^(track|path|bridleway|unclassified)$"](${bbox});); out geom;`;
  const servidores = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.openstreetmap.ru/api/interpreter'
  ];
  if(desdeCache === 0) mostrarAvisoOsm('Buscando caminos en esta zona…');
  for(const servidor of servidores){
    try{
      const resp = await fetch(servidor + '?data=' + encodeURIComponent(query));
      if(!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      guardarEnCacheOsm(data.elements || []);
      ultimoBboxConsultado = bAmpliado;
      let nuevos = 0;
      (data.elements || []).forEach(way=>{
        if(idsOsmRenderizados.has(way.id) || !way.geometry || way.geometry.length < 2) return;
        idsOsmRenderizados.add(way.id);
        const coords = way.geometry.map(pt => [pt.lat, pt.lon]);
        const { dificultad, legal, motivos } = estimarPista(way.tags || {});
        renderCaminoOsm(coords, dificultad, legal, way.tags || {}, motivos);
        nuevos++;
      });
      if(nuevos > 0) mostrarAvisoOsm(`${nuevos} caminos nuevos`, true);
      return;
    }catch(e){
      console.warn('Fallo con ' + servidor, e);
    }
  }
  if(desdeCache === 0) mostrarAvisoOsm('No se pudo conectar con OpenStreetMap ahora mismo', true);
}

map.on('moveend', ()=>{
  clearTimeout(timeoutCargaOsm);
  timeoutCargaOsm = setTimeout(cargarCaminosOsmEnVista, 700);
});
cargarCaminosOsmEnVista();

const userIcon = L.divIcon({
  className:'',
  html:`<div style="position:relative;width:16px;height:16px;">
          <div style="width:16px;height:16px;border-radius:50%;background:#378ADD;border:3px solid white;box-shadow:0 0 0 6px rgba(55,138,221,.25);"></div>
          <div id="flechaRumbo" style="position:absolute;top:-16px;left:2px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:12px solid #378ADD;transform-origin:6px 20px;filter:drop-shadow(0 0 1px white);"></div>
        </div>`,
  iconSize:[16,16], iconAnchor:[8,8]
});
let userMarker = null;
let tripKm = 0;
let ultimaPosTrip = null;

function distanciaKm(a, b){
  const R = 6371;
  const dLat = (b[0]-a[0])*Math.PI/180;
  const dLon = (b[1]-a[1])*Math.PI/180;
  const lat1 = a[0]*Math.PI/180, lat2 = b[0]*Math.PI/180;
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function onPos(pos){
  avisoGpsActivo = false;
  const { latitude, longitude, speed, heading } = pos.coords;
  const latlng = [latitude, longitude];
  if(!userMarker){
    userMarker = L.marker(latlng, { icon:userIcon }).addTo(map);
    map.setView(latlng, 15);
  } else {
    userMarker.setLatLng(latlng);
  }
  const kmh = (speed!=null && !isNaN(speed)) ? Math.round(speed*3.6) : null;
  document.getElementById('speedVal').textContent = kmh!=null ? kmh : '--';

  // Rumbo (grados), directamente del GPS — el mismo dato que usan los roadbooks
  const rumboEl = document.getElementById('rumboVal');
  if(heading!=null && !isNaN(heading)){
    rumboEl.textContent = Math.round(heading) + '°';
  } else {
    rumboEl.textContent = '--';
  }

  // Flecha de rumbo: gira sobre sí misma según tu dirección, sin mover ni girar el mapa
  if(heading!=null && !isNaN(heading)){
    const flecha = document.getElementById('flechaRumbo');
    if(flecha) flecha.style.transform = `rotate(${heading}deg)`;
  }

  // Trip: distancia acumulada desde el último reinicio
  if(ultimaPosTrip){
    const d = distanciaKm(ultimaPosTrip, latlng);
    if(d < 0.2){ tripKm += d; } // filtra saltos raros del GPS
    document.getElementById('tripVal').textContent = tripKm.toFixed(1);
  }
  ultimaPosTrip = latlng;
}

function onErr(err){
  const motivos = {1:'Permiso denegado', 2:'Posición no disponible', 3:'Tiempo agotado'};
  document.getElementById('speedVal').textContent = '--';
  console.warn('GPS error:', motivos[err.code] || err.message);
  alert('GPS: ' + (motivos[err.code] || err.message));
}

let avisoGpsActivo = false;
function onErrWatch(err){
  const motivos = {1:'Permiso denegado', 2:'Señal GPS perdida', 3:'Buscando señal GPS…'};
  document.getElementById('speedVal').textContent = '--';
  console.warn('GPS (watch) error:', motivos[err.code] || err.message);
  if(!avisoGpsActivo){
    avisoGpsActivo = true;
    mostrarAvisoOsm(motivos[err.code] || 'GPS: señal perdida');
  }
}

if('geolocation' in navigator){
  navigator.geolocation.getCurrentPosition(onPos, onErr, { enableHighAccuracy:true, timeout:10000 });
  navigator.geolocation.watchPosition(onPos, onErrWatch, { enableHighAccuracy:true, timeout:10000 });
} else {
  alert('Este navegador no soporta geolocalización');
}

// ---- Seguir el trazado real de caminos existentes entre los puntos marcados ----
async function obtenerRutaSiguiendoCaminos(puntos){
  if(puntos.length < 2) return null;
  const coordsStr = puntos.map(p => `${p[1]},${p[0]}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/foot/${coordsStr}?overview=full&geometries=geojson`;
  const control = new AbortController();
  const limite = setTimeout(()=> control.abort(), 8000); // no esperar más de 8 segundos
  try{
    const resp = await fetch(url, { signal: control.signal });
    const data = await resp.json();
    if(data.code === 'Ok' && data.routes && data.routes[0]){
      return data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
    }
  }catch(e){
    console.warn('No se pudo calcular el trazado real (o tardó demasiado)', e);
  }finally{
    clearTimeout(limite);
  }
  return null;
}

// ---- Descargar la zona actual para uso offline ----
function long2tile(lon, z){ return Math.floor((lon+180)/360*Math.pow(2,z)); }
function lat2tile(lat, z){ return Math.floor((1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*Math.pow(2,z)); }

async function descargarZonaOffline(){
  const b = map.getBounds();
  const zActual = map.getZoom();
  const zooms = [];
  for(let z = Math.max(13, zActual-1); z <= Math.min(17, zActual+2); z++) zooms.push(z);

  let urls = [];
  zooms.forEach(z=>{
    const xMin = long2tile(b.getWest(), z), xMax = long2tile(b.getEast(), z);
    const yMin = lat2tile(b.getNorth(), z), yMax = lat2tile(b.getSouth(), z);
    for(let x=xMin; x<=xMax; x++){
      for(let y=yMin; y<=yMax; y++){
        urls.push(capaActiva.getTileUrl({x, y, z}));
      }
    }
  });
  urls = urls.slice(0, 500); // límite de seguridad, evita descargas descontroladas

  mostrarAvisoOsm(`Descargando mapa… 0/${urls.length}`);
  let hechos = 0;
  for(const url of urls){
    try{ await fetch(url); }catch(e){}
    hechos++;
    if(hechos % 15 === 0) mostrarAvisoOsm(`Descargando mapa… ${hechos}/${urls.length}`);
  }

  mostrarAvisoOsm('Guardando caminos de la zona…');
  const bboxAmplio = `${b.getSouth()-0.01},${b.getWest()-0.01},${b.getNorth()+0.01},${b.getEast()+0.01}`;
  const query = `[out:json][timeout:25];(way["highway"~"^(track|path|bridleway|unclassified)$"](${bboxAmplio});); out geom;`;
  try{
    const resp = await fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query));
    const data = await resp.json();
    guardarEnCacheOsm(data.elements || []);
  }catch(e){
    console.warn('No se pudieron guardar caminos extra', e);
  }

  mostrarAvisoOsm('Zona guardada para uso sin conexión ✓', true);
}
const GPX_STORAGE_KEY = 'senderos_ultimo_gpx';
let capaGpx = null;
let capaFlechasGpx = null;
let gpxActual = null; // { nombre, coords }

function calcularRumbo(a, b){
  const lat1 = a[0]*Math.PI/180, lat2 = b[0]*Math.PI/180;
  const dLon = (b[1]-a[1])*Math.PI/180;
  const y = Math.sin(dLon)*Math.cos(lat2);
  const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
  return (Math.atan2(y,x)*180/Math.PI + 360) % 360;
}

function iconoFlecha(angulo, tam){
  const base = tam * 0.46;
  return L.divIcon({
    className:'',
    html:`<div style="width:0;height:0;border-left:${base}px solid transparent;border-right:${base}px solid transparent;border-bottom:${tam}px solid #8A3FFC;transform:rotate(${angulo}deg);filter:drop-shadow(0 0 1.5px white);"></div>`,
    iconSize:[tam,tam], iconAnchor:[tam/2,tam/2]
  });
}

// A más zoom (más cerca), flechas más pequeñas pero más numerosas; al alejar, más grandes hasta un tamaño máximo
function parametrosFlechasPorZoom(z){
  if(z <= 13) return { tam:13, factorDensidad:12 };
  if(z === 14) return { tam:11, factorDensidad:8 };
  if(z === 15) return { tam:10, factorDensidad:5 };
  if(z === 16) return { tam:9,  factorDensidad:3 };
  return { tam:8, factorDensidad:2 }; // zoom 17+
}

function actualizarFlechasGpx(){
  if(!gpxActual) return;
  if(capaFlechasGpx) map.removeLayer(capaFlechasGpx);
  capaFlechasGpx = L.layerGroup().addTo(map);
  const coords = gpxActual.coords;
  const { tam, factorDensidad } = parametrosFlechasPorZoom(map.getZoom());
  const nFlechas = Math.max(3, Math.min(90, Math.round(coords.length / factorDensidad)));
  const paso = Math.max(1, Math.floor(coords.length / nFlechas));
  for(let i=0; i<coords.length-1; i+=paso){
    const rumbo = calcularRumbo(coords[i], coords[i+1]);
    L.marker(coords[i], { icon: iconoFlecha(rumbo, tam), interactive:false }).addTo(capaFlechasGpx);
  }
}
map.on('zoomend', actualizarFlechasGpx);

function dibujarGpx(coords, nombre){
  if(capaGpx){ map.removeLayer(capaGpx); }
  gpxActual = { nombre, coords };
  try{ localStorage.setItem(GPX_STORAGE_KEY, JSON.stringify(gpxActual)); }catch(err){}
  capaGpx = L.layerGroup().addTo(map);
  L.polyline(coords, { color:'#ffffff', weight:6, opacity:0.9, lineCap:'round' }).addTo(capaGpx);
  L.polyline(coords, { color:'#8A3FFC', weight:3, opacity:1, lineCap:'round' }).addTo(capaGpx);
  L.circleMarker(coords[0], { radius:7, color:'#8A3FFC', fillColor:'white', fillOpacity:1, weight:3 })
    .bindPopup(`<b>${nombre || 'Track GPX'}</b>Inicio del recorrido`).addTo(capaGpx);

  map.fitBounds(L.polyline(coords).getBounds(), { padding:[40,40] });
  actualizarFlechasGpx();
}

function invertirGpx(){
  if(!gpxActual) return;
  dibujarGpx(gpxActual.coords.slice().reverse(), gpxActual.nombre);
}

function quitarGpx(){
  if(capaGpx){ map.removeLayer(capaGpx); capaGpx = null; }
  if(capaFlechasGpx){ map.removeLayer(capaFlechasGpx); capaFlechasGpx = null; }
  gpxActual = null;
  localStorage.removeItem(GPX_STORAGE_KEY);
}

function parsearGpx(texto){
  const xml = new DOMParser().parseFromString(texto, 'text/xml');
  let puntos = Array.from(xml.querySelectorAll('trkpt'));
  if(puntos.length === 0) puntos = Array.from(xml.querySelectorAll('rtept'));
  return puntos.map(p => [parseFloat(p.getAttribute('lat')), parseFloat(p.getAttribute('lon'))])
               .filter(c => !isNaN(c[0]) && !isNaN(c[1]));
}

document.getElementById('gpxInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const texto = ev.target.result;
    const coords = parsearGpx(texto);
    if(coords.length < 2){
      alert('No se han podido leer puntos de recorrido en este archivo GPX.');
      return;
    }
    dibujarGpx(coords, file.name.replace('.gpx',''));
  };
  reader.readAsText(file);
  e.target.value = '';
});

    alert('Marca al menos dos puntos en el mapa para formar un camino.');
    return;
  }

  document.getElementById('drawHint').textContent = 'Calculando trazado real…';
  document.getElementById('btnFinishDraw').disabled = true;

  const rutaReal = await obtenerRutaSiguiendoCaminos(puntosNuevos);

  document.getElementById('btnFinishDraw').disabled = false;
  document.getElementById('drawHint').textContent = 'Toca el mapa para marcar el camino';

  if(rutaReal && rutaReal.length > 1){
    puntosNuevos = rutaReal;
    if(lineaTemp) map.removeLayer(lineaTemp);
    lineaTemp = L.polyline(puntosNuevos, { color:'#378ADD', weight:4, dashArray:'6,6' }).addTo(map);
  } else {
    alert('No se ha encontrado un camino trazado entre esos puntos (puede que sea una zona sin mapear todavía). Se usará la línea recta que marcaste.');
  }

  dificultadSel = 'verde'; legalSel = 'verde';
  pintarSeleccion('swatchesDificultad', 'verde');
  pintarSeleccion('swatchesLegal', 'verde');
  document.getElementById('nombrePista').value = '';
  sheetOverlay.classList.add('show');
});

document.getElementById('btnCancelarSheet').addEventListener('click', ()=>{
  sheetOverlay.classList.remove('show');
});

document.getElementById('btnGuardarPista').addEventListener('click', ()=>{
  const nombre = document.getElementById('nombrePista').value.trim();
  const nuevaPista = {
    idUsuario: 'p' + Date.now(),
    nombre: nombre || 'Camino sin nombre',
    coords: puntosNuevos.slice(),
    dificultad: dificultadSel,
    legal: legalSel,
    info: ''
  };
  guardarPistaUsuario(nuevaPista);
  renderPista(nuevaPista);
  sheetOverlay.classList.remove('show');
  activarDibujo(false);
});
</script>

</body>
</html>
