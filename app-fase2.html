<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<title>Senderos Todoterreno — Fase 1 (MapLibre)</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{
    --bg:#151a14; --panel:#1e251c; --ink:#eef0e6; --muted:#9aa593;
    --verde:#4C8A22; --amarillo:#FFD400; --rojo:#E10600; --naranja:#B85C00; --azul:#378ADD;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);}
  #map{position:absolute;inset:0;}

  .topbar-left{ position:absolute;top:14px;left:14px;z-index:1000;display:flex;align-items:flex-start;gap:8px; }
  .info-toggle{
    width:38px;height:38px;border-radius:10px;background:var(--panel);border:none;color:var(--ink);
    box-shadow:0 2px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;
    font-size:14px;transition:transform .2s;
  }
  .info-toggle.abierto{ transform:rotate(180deg); }
  .info-panel{ display:none;gap:8px; }
  .info-panel.show{ display:flex; }
  .info-box{ background:var(--panel);border-radius:10px;padding:8px 14px;text-align:center;min-width:64px;box-shadow:0 2px 10px rgba(0,0,0,.35); }
  .info-box .val{ font-size:18px;font-weight:600;line-height:1; }
  .info-box .unit{ font-size:10px;color:var(--muted);margin-top:2px; }

  .topbar{ position:absolute;top:0;left:0;right:0;z-index:1000;display:flex;justify-content:flex-end;padding:14px;pointer-events:none; }
  .speed-badge{ background:var(--panel);border-radius:10px;padding:8px 16px;text-align:center;min-width:64px;box-shadow:0 2px 10px rgba(0,0,0,.35);pointer-events:auto; }
  .speed-badge .val{ font-size:20px;font-weight:600;line-height:1; }
  .speed-badge .unit{ font-size:10px;color:var(--muted);margin-top:2px; }

  .aviso{
    position:absolute;left:14px;top:64px;z-index:1500;background:var(--panel);color:var(--ink);
    padding:8px 14px;border-radius:10px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.35);
    opacity:0;transition:opacity .3s;pointer-events:none;
  }
  .aviso.show{ opacity:1; }

  .menu-btn{
    position:absolute;bottom:24px;right:14px;z-index:1400;width:50px;height:50px;border-radius:50%;
    background:var(--panel);border:none;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;font-size:20px;
  }
  .menu-btn.active{ background:var(--azul); }
  .menu-panel{
    position:absolute;bottom:82px;right:14px;z-index:1400;background:var(--panel);border-radius:12px;
    overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.35);display:none;flex-direction:column;min-width:220px;
  }
  .menu-panel.show{ display:flex; }
  .menu-panel button{ background:none;border:none;color:var(--ink);text-align:left;padding:13px 16px;font-size:14px; }
  .menu-panel button:not(:last-child){ border-bottom:1px solid rgba(255,255,255,.08); }

  .zoom-fino{
    position:absolute;bottom:24px;right:70px;z-index:1400;display:flex;background:var(--panel);
    border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.35);
  }
  .zoom-fino button{ width:34px;height:34px;border:none;background:none;color:var(--ink);font-size:16px; }

  .punto-usuario{ width:16px;height:16px;position:relative; }
  .punto-usuario .base{ width:16px;height:16px;border-radius:50%;background:var(--azul);border:3px solid white;box-shadow:0 0 0 6px rgba(55,138,221,.25); }
  .punto-usuario .flecha{
    position:absolute;top:-16px;left:2px;width:0;height:0;
    border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:12px solid var(--azul);
    transform-origin:6px 20px;filter:drop-shadow(0 0 1px white);
  }

  .maplibregl-ctrl-attrib{ font-size:9px !important; }
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar-left">
  <button class="info-toggle" id="infoToggle" title="Rumbo y trip">›</button>
  <div class="info-panel" id="infoPanel">
    <div class="info-box" id="tripBox" title="Toca para reiniciar"><div class="val" id="tripVal">0.0</div><div class="unit">trip km</div></div>
    <div class="info-box"><div class="val" id="rumboVal">--</div><div class="unit">grados</div></div>
  </div>
</div>

<div class="topbar">
  <div class="speed-badge"><div class="val" id="speedVal">--</div><div class="unit">km/h</div></div>
</div>

<div class="aviso" id="aviso"></div>

<div class="zoom-fino">
  <button id="zoomOut">−</button>
  <button id="zoomIn">+</button>
</div>

<button class="menu-btn" id="menuBtn" title="Menú">☰</button>
<div class="menu-panel" id="menuPanel"></div>

<script>
const MAPTILER_KEY = 'XgC5ZGwB6l2URF1gr8I1';
const START = [-0.7667, 38.6333]; // [lon, lat] — MapLibre usa lon,lat (al revés que Leaflet)

// ---- Los tres mapas base ----
const FUENTES = {
  minimal: `https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}@2x.png?key=${MAPTILER_KEY}`,
  topo: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
  satelite: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
};

function construirEstilo(capaActiva){
  return {
    version: 8,
    sources: {
      minimal: { type:'raster', tiles:[FUENTES.minimal], tileSize:512, attribution:'© MapTiler © OpenStreetMap' },
      topo: { type:'raster', tiles:['https://a.tile.opentopomap.org/{z}/{x}/{y}.png','https://b.tile.opentopomap.org/{z}/{x}/{y}.png','https://c.tile.opentopomap.org/{z}/{x}/{y}.png'], tileSize:256, attribution:'© OpenStreetMap, SRTM | OpenTopoMap' },
      satelite: { type:'raster', tiles:[FUENTES.satelite], tileSize:256, attribution:'Esri World Imagery' }
    },
    layers: [
      { id:'capa-minimal', type:'raster', source:'minimal', layout:{ visibility: capaActiva==='minimal' ? 'visible':'none' } },
      { id:'capa-topo', type:'raster', source:'topo', layout:{ visibility: capaActiva==='topo' ? 'visible':'none' } },
      { id:'capa-satelite', type:'raster', source:'satelite', layout:{ visibility: capaActiva==='satelite' ? 'visible':'none' } }
    ]
  };
}

let capaActual = 'minimal';
const map = new maplibregl.Map({
  container: 'map',
  style: construirEstilo(capaActual),
  center: START,
  zoom: 14,
  pitch: 0,
  bearing: 0,
  attributionControl: { compact:true }
});

function cambiarCapa(nombre){
  capaActual = nombre;
  ['minimal','topo','satelite'].forEach(c=>{
    map.setLayoutProperty('capa-'+c, 'visibility', c===nombre ? 'visible' : 'none');
  });
}

// ---- Aviso simple ----
function mostrarAviso(texto, autoOcultar){
  const el = document.getElementById('aviso');
  el.textContent = texto;
  el.classList.add('show');
  if(autoOcultar){
    clearTimeout(mostrarAviso._t);
    mostrarAviso._t = setTimeout(()=> el.classList.remove('show'), 3000);
  }
}

// ================== SISTEMA DE CAMINOS Y COLORES ==================
const COLOR_GRIS = '#8a8a8a';
const COLOR_VIA_PECUARIA = '#8B5E3C';

// Datos de todos los caminos ya cargados (para la fuente GeoJSON)
const featuresCaminos = [];
const idsRenderizados = new Set();

function actualizarFuenteCaminos(){
  const src = map.getSource('caminos');
  if(src) src.setData({ type:'FeatureCollection', features: featuresCaminos });
}

function estimarPista(tags){
  let dificultad = null, legal = null;
  const motivos = [];
  const tracktype = tags.tracktype, surface = tags.surface, smoothness = tags.smoothness;
  const width = parseFloat(tags.width);
  const access = tags.access;
  const motorVehicle = tags.motor_vehicle || tags.motorcar;
  const soloTodoterreno = tags['4wd_only'] === 'yes';
  const tieneVado = tags.ford === 'yes';

  const TEXTO_TRACKTYPE = { grade1:'pista sólida y bien afirmada', grade2:'pista bastante sólida', grade3:'pista mixta (tierra y piedra)', grade4:'pista poco firme', grade5:'pista muy blanda o poco definida' };
  const TEXTO_SMOOTHNESS = { excellent:'superficie excelente', good:'superficie en buen estado', intermediate:'superficie irregular', bad:'superficie en mal estado', very_bad:'superficie muy deteriorada', horrible:'superficie muy difícil', very_horrible:'superficie extrema', impassable:'intransitable' };
  const TEXTO_SURFACE = { compacted:'firme compactado', gravel:'grava', fine_gravel:'gravilla fina', ground:'tierra', dirt:'tierra suelta', unpaved:'sin asfaltar', rock:'roca', mud:'barro', sand:'arena', stone:'piedra' };

  if(['asphalt','paved','concrete','paving_stones'].includes(surface)){
    return { dificultad:'gris', legal:'gris', motivos:['Firme asfaltado: no se clasifica como pista offroad'] };
  }

  if(smoothness && TEXTO_SMOOTHNESS[smoothness]){
    if(['excellent','good'].includes(smoothness)){ dificultad='verde'; motivos.push(TEXTO_SMOOTHNESS[smoothness]); }
    else if(smoothness==='intermediate'){ dificultad='amarillo'; motivos.push(TEXTO_SMOOTHNESS[smoothness]); }
    else if(['bad','very_bad','horrible','very_horrible','impassable'].includes(smoothness)){ dificultad='rojo'; motivos.push(TEXTO_SMOOTHNESS[smoothness]); }
  }
  if(dificultad===null && tracktype && TEXTO_TRACKTYPE[tracktype]){
    if(tracktype==='grade1'||tracktype==='grade2'){ dificultad='verde'; motivos.push(TEXTO_TRACKTYPE[tracktype]); }
    else if(tracktype==='grade3'){ dificultad='amarillo'; motivos.push(TEXTO_TRACKTYPE[tracktype]); }
    else if(tracktype==='grade4'||tracktype==='grade5'){ dificultad='rojo'; motivos.push(TEXTO_TRACKTYPE[tracktype]); }
  }
  if(dificultad===null && surface && TEXTO_SURFACE[surface]){
    if(surface==='compacted'){ dificultad='verde'; motivos.push(TEXTO_SURFACE[surface]); }
    else if(['gravel','fine_gravel','ground','dirt','unpaved'].includes(surface)){ dificultad='amarillo'; motivos.push(TEXTO_SURFACE[surface]); }
    else if(['rock','mud','sand','stone'].includes(surface)){ dificultad='rojo'; motivos.push(TEXTO_SURFACE[surface]); }
  }
  if(soloTodoterreno){ dificultad='rojo'; motivos.push('solo apto para todoterreno'); }
  if(tieneVado){ dificultad='rojo'; motivos.push('tiene vado o cruce de agua'); }

  if(!isNaN(width)){ legal = width>=4 ? 'verde':'rojo'; motivos.push('ancho: '+width+' m'); }
  if(access==='no'||access==='private'||motorVehicle==='no'||motorVehicle==='private'){ legal='rojo'; motivos.push('acceso restringido'); }
  if(legal===null && dificultad!==null) legal='amarillo';

  return { dificultad: dificultad||'gris', legal: legal||'gris', motivos };
}

// ---- Vías pecuarias ----
let viasPecuarias = [];
const indiceViasPecuarias = new Map();
function claveCelda(lat, lon){ return Math.round(lat*100)+'_'+Math.round(lon*100); }
function construirIndiceViasPecuarias(){
  viasPecuarias.forEach((via, idx)=>{
    via.l.forEach(linea=>{
      linea.forEach(pt=>{
        const clave = claveCelda(pt[0], pt[1]);
        if(!indiceViasPecuarias.has(clave)) indiceViasPecuarias.set(clave, new Set());
        indiceViasPecuarias.get(clave).add(idx);
      });
    });
  });
}
fetch('./vias-pecuarias.json').then(r=>r.json()).then(data=>{ viasPecuarias=data; construirIndiceViasPecuarias(); }).catch(()=>{});

function distanciaKmSimple(a,b){
  const R=6371, dLat=(b[0]-a[0])*Math.PI/180, dLon=(b[1]-a[1])*Math.PI/180;
  const lat1=a[0]*Math.PI/180, lat2=b[0]*Math.PI/180;
  const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function comprobarViaPecuaria(coordsCamino){
  const candidatos = new Set();
  coordsCamino.forEach(pt=>{
    for(let dlat=-1; dlat<=1; dlat++) for(let dlon=-1; dlon<=1; dlon++){
      const clave = (Math.round(pt[0]*100)+dlat)+'_'+(Math.round(pt[1]*100)+dlon);
      const set = indiceViasPecuarias.get(clave);
      if(set) set.forEach(i=>candidatos.add(i));
    }
  });
  let mejor=null, mejorD=0.03;
  candidatos.forEach(idx=>{
    viasPecuarias[idx].l.forEach(linea=>{
      linea.forEach(ptVia=>{
        coordsCamino.forEach(ptCamino=>{
          const d = distanciaKmSimple(ptVia, ptCamino);
          if(d<mejorD){ mejorD=d; mejor=viasPecuarias[idx]; }
        });
      });
    });
  });
  return mejor;
}

function estimarPistaConViaPecuaria(tags, coords){
  const resultado = estimarPista(tags);
  const via = comprobarViaPecuaria(coords);
  if(via){
    if(resultado.legal!=='rojo') resultado.legal='amarillo';
    resultado.esViaPecuaria = true;
    resultado.motivos.push(`coincide con vía pecuaria "${via.n}" (${via.t}) — circulación a motor restringida, revisar normativa`);
  }
  return resultado;
}

// ---- Caché local de caminos ----
const OSM_CACHE_KEY = 'senderos_cache_osm_v1';
function leerCacheOsm(){ try{ return JSON.parse(localStorage.getItem(OSM_CACHE_KEY))||[]; }catch(e){ return []; } }
function guardarEnCacheOsm(nuevos){
  if(!nuevos||!nuevos.length) return;
  const actuales = leerCacheOsm();
  const idsExistentes = new Set(actuales.map(w=>w.id));
  nuevos.forEach(w=>{
    if(!idsExistentes.has(w.id) && w.geometry && w.geometry.length>1){
      actuales.push({ id:w.id, geometry:w.geometry, tags:w.tags||{} });
      idsExistentes.add(w.id);
    }
  });
  try{ localStorage.setItem(OSM_CACHE_KEY, JSON.stringify(actuales.slice(-8000))); }catch(e){}
}

function agregarCamino(id, coordsLonLat, tags){
  if(idsRenderizados.has(id)) return;
  idsRenderizados.add(id);
  const coordsLatLon = coordsLonLat.map(c=>[c[1],c[0]]);
  const { dificultad, legal, motivos, esViaPecuaria } = estimarPistaConViaPecuaria(tags||{}, coordsLatLon);
  featuresCaminos.push({
    type:'Feature',
    properties: {
      id, dificultad, legal, esViaPecuaria: !!esViaPecuaria,
      nombre: tags && tags.name ? tags.name : 'Camino sin nombre',
      detalle: (motivos&&motivos.length) ? motivos.join(' · ') : 'Sin datos suficientes'
    },
    geometry: { type:'LineString', coordinates: coordsLonLat }
  });
}

function wayDentroDeBbox(way, b){
  return way.geometry.some(pt => pt.lat>=b.getSouth() && pt.lat<=b.getNorth() && pt.lon>=b.getWest() && pt.lon<=b.getEast());
}

let ultimoBboxConsultado = null;
function bboxCubierto(actual, anterior){
  if(!anterior) return false;
  return actual.getSouth()>=anterior.s && actual.getNorth()<=anterior.n && actual.getWest()>=anterior.w && actual.getEast()<=anterior.e;
}

async function cargarCaminosEnVista(){
  if(map.getZoom() < 13) return;
  const b = map.getBounds();

  // Desde caché local (offline y rápido)
  let nuevos = 0;
  leerCacheOsm().forEach(way=>{
    if(!wayDentroDeBbox(way, b)) return;
    if(idsRenderizados.has(way.id)) return;
    agregarCamino(way.id, way.geometry.map(pt=>[pt.lon,pt.lat]), way.tags);
    nuevos++;
  });
  if(nuevos>0) actualizarFuenteCaminos();

  if(bboxCubierto(b, ultimoBboxConsultado)) return;
  if(!navigator.onLine) return;

  const bbox = `${b.getSouth()-0.05},${b.getWest()-0.05},${b.getNorth()+0.05},${b.getEast()+0.05}`;
  const query = `[out:json][timeout:25];(way["highway"~"^(track|path|bridleway|unclassified)$"](${bbox});); out geom;`;
  const servidores = ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.openstreetmap.ru/api/interpreter'];
  for(const servidor of servidores){
    try{
      const resp = await fetch(servidor+'?data='+encodeURIComponent(query));
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      const data = await resp.json();
      guardarEnCacheOsm(data.elements||[]);
      ultimoBboxConsultado = { s:b.getSouth()-0.05, w:b.getWest()-0.05, n:b.getNorth()+0.05, e:b.getEast()+0.05 };
      let nuevosRed = 0;
      (data.elements||[]).forEach(way=>{
        if(idsRenderizados.has(way.id) || !way.geometry || way.geometry.length<2) return;
        agregarCamino(way.id, way.geometry.map(pt=>[pt.lon,pt.lat]), way.tags);
        nuevosRed++;
      });
      if(nuevosRed>0) actualizarFuenteCaminos();
      return;
    }catch(e){ console.warn('Fallo con '+servidor, e); }
  }
}

let timeoutCarga = null;
map.on('load', ()=>{
  map.addSource('caminos', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });

  // Contorno (legalidad / vía pecuaria)
  map.addLayer({
    id:'caminos-casing', type:'line', source:'caminos',
    layout:{ 'line-cap':'round', 'line-join':'round' },
    paint:{
      'line-color': ['case',
        ['get','esViaPecuaria'], COLOR_VIA_PECUARIA,
        ['match', ['get','legal'], 'verde','#4C8A22', 'amarillo','#D98A00', 'rojo','#B00000', COLOR_GRIS]
      ],
      'line-width': ['interpolate',['linear'],['zoom'], 13,2.6, 15,4.8, 17,8, 19,14],
      'line-opacity': ['case', ['==', ['get','dificultad'], 'gris'], 0.5, 1]
    }
  });
  // Hueco
  map.addLayer({
    id:'caminos-gap', type:'line', source:'caminos',
    layout:{ 'line-cap':'round', 'line-join':'round' },
    paint:{
      'line-color': '#E7E2CC',
      'line-width': ['interpolate',['linear'],['zoom'], 13,1.4, 15,2.7, 17,4.5, 19,8],
      'line-opacity': ['case', ['get','esViaPecuaria'], 0, 0.9]
    }
  });
  // Interior (dificultad)
  map.addLayer({
    id:'caminos-interior', type:'line', source:'caminos',
    layout:{ 'line-cap':'round', 'line-join':'round' },
    paint:{
      'line-color': ['case',
        ['get','esViaPecuaria'], COLOR_VIA_PECUARIA,
        ['match', ['get','dificultad'], 'verde','#4C8A22', 'amarillo','#FFD400', 'rojo','#E10600', COLOR_GRIS]
      ],
      'line-width': ['interpolate',['linear'],['zoom'], 13,0.8, 15,1.4, 17,2.4, 19,4],
      'line-opacity': ['case', ['==', ['get','dificultad'], 'gris'], 0.6, 1]
    }
  });

  map.on('click', 'caminos-casing', (e)=>{
    const p = e.features[0].properties;
    new maplibregl.Popup({ closeButton:true })
      .setLngLat(e.lngLat)
      .setHTML(`<b>${p.nombre}</b><br>${p.dificultad==='gris' ? 'Sin clasificar todavía' : `Estimación automática (${p.detalle}) · revisar sobre el terreno`}`)
      .addTo(map);
  });

  cargarCaminosEnVista();
  map.on('moveend', ()=>{
    clearTimeout(timeoutCarga);
    timeoutCarga = setTimeout(cargarCaminosEnVista, 700);
  });
});
// ================== FIN SISTEMA DE CAMINOS ==================

// ---- Zoom con pasos finos de 100m cerca de 1km (igual que en la app actual) ----
function metrosPorPixel(zoom, lat){ return 156543.03392 * Math.cos(lat*Math.PI/180) / Math.pow(2, zoom); }
function zoomParaDistancia(distanciaMetros, lat){ return Math.log2(156543.03392 * Math.cos(lat*Math.PI/180) * 100 / distanciaMetros); }
function escalaActualMetros(){ const c = map.getCenter(); return metrosPorPixel(map.getZoom(), c.lat) * 100; }

function zoomConPasoFino(sentido){
  const c = map.getCenter();
  const escala = escalaActualMetros();
  if(escala >= 50 && escala <= 5000){
    const actualRedondeado = Math.round(escala/100)*100;
    const nuevaDistancia = actualRedondeado - sentido*100;
    if(nuevaDistancia >= 50){
      map.easeTo({ zoom: zoomParaDistancia(nuevaDistancia, c.lat), duration:150 });
      return;
    }
  }
  map.easeTo({ zoom: map.getZoom() + sentido, duration:150 });
}
document.getElementById('zoomIn').addEventListener('click', ()=> zoomConPasoFino(1));
document.getElementById('zoomOut').addEventListener('click', ()=> zoomConPasoFino(-1));

// ---- GPS: posición, flecha de rumbo, velocidad, trip, y rotación real del mapa ----
let marker = null;
let modoRumboArriba = true; // en esta fase de prueba lo dejamos activo por defecto
let tripKm = 0;
let ultimaPosTrip = null;

function distanciaKm(a,b){
  const R=6371, dLat=(b[0]-a[0])*Math.PI/180, dLon=(b[1]-a[1])*Math.PI/180;
  const lat1=a[0]*Math.PI/180, lat2=b[0]*Math.PI/180;
  const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function onPos(pos){
  const { latitude, longitude, speed, heading } = pos.coords;
  const lonlat = [longitude, latitude];

  if(!marker){
    const el = document.createElement('div');
    el.className = 'punto-usuario';
    el.innerHTML = `<div class="flecha" id="flechaRumbo"></div><div class="base"></div>`;
    marker = new maplibregl.Marker({ element: el }).setLngLat(lonlat).addTo(map);
    map.setCenter(lonlat);
  } else {
    marker.setLngLat(lonlat);
  }

  const kmh = (speed!=null && !isNaN(speed)) ? Math.round(speed*3.6) : null;
  document.getElementById('speedVal').textContent = kmh!=null ? kmh : '--';

  const rumboEl = document.getElementById('rumboVal');
  if(heading!=null && !isNaN(heading)){
    rumboEl.textContent = Math.round(heading)+'°';
    const flecha = document.getElementById('flechaRumbo');
    if(flecha && !modoRumboArriba) flecha.style.transform = `rotate(${heading}deg)`;
  } else {
    rumboEl.textContent = '--';
  }

  if(modoRumboArriba){
    map.easeTo({ center: lonlat, bearing: (heading!=null && !isNaN(heading)) ? heading : map.getBearing(), duration:300 });
  } else {
    map.easeTo({ center: lonlat, duration:300 });
  }

  if(ultimaPosTrip){
    const d = distanciaKm(ultimaPosTrip, [latitude, longitude]);
    if(d < 0.2) tripKm += d;
    document.getElementById('tripVal').textContent = tripKm.toFixed(1);
  }
  ultimaPosTrip = [latitude, longitude];
}

function onErr(err){
  document.getElementById('speedVal').textContent = '--';
  mostrarAviso('GPS: ' + (err.message || 'sin señal'), true);
}

if('geolocation' in navigator){
  navigator.geolocation.getCurrentPosition(onPos, onErr, { enableHighAccuracy:true, timeout:10000 });
  navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy:true, timeout:10000 });
}

document.getElementById('tripBox').addEventListener('click', ()=>{
  tripKm = 0;
  document.getElementById('tripVal').textContent = '0.0';
});
document.getElementById('infoToggle').addEventListener('click', ()=>{
  document.getElementById('infoPanel').classList.toggle('show');
  document.getElementById('infoToggle').classList.toggle('abierto');
});

// ---- Menú principal ----
const menuBtn = document.getElementById('menuBtn');
const menuPanel = document.getElementById('menuPanel');

function abrirMenu(){
  menuPanel.innerHTML = `
    <button data-action="locate">📍 Mi posición</button>
    <button data-action="capa-minimal">🗺️ Mapa: Minimalista</button>
    <button data-action="capa-topo">🗺️ Mapa: Topográfico</button>
    <button data-action="capa-satelite">🗺️ Mapa: Satélite</button>
    <button data-action="rumbo-toggle">🧭 ${modoRumboArriba ? 'Desactivar' : 'Activar'} rumbo arriba</button>
  `;
  menuPanel.classList.add('show');
  menuBtn.classList.add('active');
}
function cerrarMenu(){
  menuPanel.classList.remove('show');
  menuBtn.classList.remove('active');
}
menuBtn.addEventListener('click', ()=> menuPanel.classList.contains('show') ? cerrarMenu() : abrirMenu());
menuPanel.addEventListener('click', (e)=>{
  const accion = e.target.dataset.action;
  if(!accion) return;
  cerrarMenu();
  if(accion === 'locate' && marker) map.easeTo({ center: marker.getLngLat(), zoom:16 });
  else if(accion === 'capa-minimal') cambiarCapa('minimal');
  else if(accion === 'capa-topo') cambiarCapa('topo');
  else if(accion === 'capa-satelite') cambiarCapa('satelite');
  else if(accion === 'rumbo-toggle'){
    modoRumboArriba = !modoRumboArriba;
    if(!modoRumboArriba) map.easeTo({ bearing:0, duration:400 });
  }
});

// ---- Mantener la pantalla encendida ----
async function mantenerPantallaEncendida(){
  try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(e){}
}
mantenerPantallaEncendida();
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') mantenerPantallaEncendida(); });
</script>
